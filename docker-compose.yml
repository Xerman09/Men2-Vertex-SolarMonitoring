services:
  deye-solar-monitoring:
    build: .
    container_name: deye-solar-monitoring
    restart: unless-stopped
    ports:
      - "3005:3005"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3005
      - ALLOW_INSECURE_INTERNAL=0
    volumes:
      - ./deye-accounts.json:/app/deye-accounts.json
      - ./deye-history-cache.json:/app/deye-history-cache.json
    mem_limit: 1024m
    mem_reservation: 256m
    cpus: 1.5
